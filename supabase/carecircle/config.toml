project_id = "carecircle"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["carecircle://auth/callback"]
enable_signup = true

[auth.rate_limit]
email_sent = 100

[storage]
enabled = true
# The 2 MB limit for prescription photos is set on the prescription-photos bucket itself (migration).
# Do not lower this global limit: visit-note audio (up to 10 minutes, CC-5a) uses the same Storage.
file_size_limit = "50MiB"

[functions.revenuecat-webhook]
verify_jwt = false

[functions.materialize-doses]
verify_jwt = false

[functions.cleanup-prescription-photos]
verify_jwt = false
