name: CI
on:
  pull_request:
    branches: [main, 'batch/**']
  push:
    branches: [main, 'batch/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Bundle the app for iOS and Android
        run: pnpm --filter carecircle export:check
      # Runs after the export so the API key search also scans the exported app bundle (F-2b).
      # The live provider test skips here: CI has no ANTHROPIC_API_KEY or GEMINI_API_KEY.
      - name: Edge Function tests
        run: deno test --node-modules-dir=none --allow-read --allow-env --allow-write --no-prompt supabase/carecircle/functions/
        env:
          CHECK_APP_BUNDLE: '1'

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No pnpm cache here: this job installs no packages, so the store folder never exists and
          # saving the cache fails the job whenever pnpm-lock.yaml changes. setup-node v5 turns the
          # cache on by itself when package.json has a packageManager field, so turn it off.
          package-manager-cache: false
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Stage CareCircle Supabase workdir and run supabase start
        run: |
          WORKDIR="$(node supabase/carecircle/cli.mjs stage)"
          # Keep storage-api enabled in the db job so pgTAP tests can verify Storage buckets and RLS policies.
          supabase start --workdir "$WORKDIR" --exclude studio,imgproxy,logflare,vector,edge-runtime,mailpit,realtime,postgres-meta,supavisor
      - name: Run pgTAP database tests
        run: pnpm test:db

  maestro:
    runs-on: ubuntu-latest
    # The release build (about 15 min) and the emulator boot take most of this.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No android-actions/setup-android: ubuntu-latest already has the Android SDK (ANDROID_HOME),
      # and that action failed here installing the removed 'tools' package before anything ran.
      - uses: gradle/actions/setup-gradle@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local Supabase with Auth, Storage, Edge Functions and Mailpit
        run: |
          WORKDIR="$(node supabase/carecircle/cli.mjs stage)"
          # Keep storage-api and edge-runtime enabled so scan-confirm.yaml and visit-note-typed.yaml
          # upload to Storage and call the local ai Edge Function.
          supabase start --workdir "$WORKDIR" --exclude studio,imgproxy,logflare,vector,realtime,postgres-meta,supavisor
          ANON_KEY="$(supabase status --workdir "$WORKDIR" -o json | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(d.ANON_KEY || d.PUBLISHABLE_KEY || "");')"
          if [ -z "$ANON_KEY" ]; then
            echo "Failed to read ANON_KEY from supabase status" >&2
            exit 1
          fi
          printf "CARECIRCLE_CI_FAKE_AI=1\n" > /tmp/ci-functions.env
          nohup supabase functions serve --workdir "$WORKDIR" --env-file /tmp/ci-functions.env >/tmp/functions-serve.log 2>&1 &
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/ai || true)"
            if [ "$code" = "401" ] || [ "$code" = "400" ] || [ "$code" = "200" ]; then
              break
            fi
            sleep 1
          done
          echo "EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          printf "EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n" "$ANON_KEY" > apps/carecircle/.env
      - name: Build Android APK for emulator
        run: |
          pnpm --filter carecircle exec expo prebuild --platform android --no-install
          node -e '
            const fs = require("fs");
            const p = "apps/carecircle/android/app/src/main/AndroidManifest.xml";
            const xml = fs.readFileSync(p, "utf8").replace("<application ", "<application android:usesCleartextTraffic=\"true\" ");
            fs.writeFileSync(p, xml);
          '
          cd apps/carecircle/android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro E2E flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          # android-emulator-runner runs each script line in its own shell, so keep it to one line.
          script: bash apps/carecircle/maestro/ci-run.sh
      - name: Keep Maestro screenshots and logs when the flow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: ignore
