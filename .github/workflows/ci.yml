name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Bundle the app for iOS and Android
        run: pnpm --filter carecircle export:check
      # Runs after the export so the API key search also scans the exported app bundle (F-2b).
      # The live provider test skips here: CI has no ANTHROPIC_API_KEY or GEMINI_API_KEY.
      - name: Edge Function tests
        run: deno test --node-modules-dir=none --allow-read --allow-env --allow-write --no-prompt supabase/carecircle/functions/ai/
        env:
          CHECK_APP_BUNDLE: '1'

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Stage CareCircle Supabase workdir and run supabase start
        run: |
          WORKDIR="$(node supabase/carecircle/cli.mjs stage)"
          supabase start --workdir "$WORKDIR" --exclude studio,imgproxy,logflare,vector,edge-runtime,mailpit
      - name: Run pgTAP database tests
        run: pnpm test:db
