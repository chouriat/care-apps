# F-4 + CC-1a: a new user signs in with an email magic link, lands on /(onboarding)/start,
# creates a circle, and lands on an empty Today screen (iOS and Android).
# Needs the local Supabase stack with Mailpit (`pnpm db:start`), carecircle://auth/callback in
# auth.additional_redirect_urls, and a dev build whose Supabase URL reaches that stack
# (http://10.0.2.2:54321 on the Android emulator). Run: maestro test apps/carecircle/maestro/
appId: app.carecircle.mobile
env:
  EMAIL: caregiver@example.com
  MAILPIT_URL: http://127.0.0.1:54324
---
- runScript: scripts/clear-mailpit.js
- launchApp:
    clearState: true
- assertVisible:
    id: 'sign-in-screen'
- tapOn:
    id: 'sign-in-email-input'
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: '(?i).*magic link.*'
- assertVisible:
    id: 'sign-in-magic-link-sent'
- retry:
    maxRetries: 5
    commands:
      - runScript: scripts/magic-link-from-mailpit.js
- openLink: ${output.callbackUrl}
- runFlow:
    when:
      visible:
        id: 'health-consent-screen'
    file: subflows/give-health-consent.yaml
- assertVisible:
    id: 'onboarding-start-screen'
- assertNotVisible:
    id: 'sign-in-screen'
- tapOn:
    id: 'onboarding-circle-name-input'
- inputText: 'Family Care'
- hideKeyboard
- tapOn:
    id: 'onboarding-recipient-name-input'
- inputText: 'Evelyn'
- hideKeyboard
- tapOn:
    id: 'onboarding-submit-button'
- assertVisible:
    id: 'today-empty-state'
