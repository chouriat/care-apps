# F-4: email magic-link sign-in reaches the signed-in placeholder (iOS and Android).
# Needs the local Supabase stack with Mailpit (`pnpm db:start`), carecircle://auth/callback in
# auth.additional_redirect_urls, and a dev build whose Supabase URL reaches that stack
# (http://10.0.2.2:54321 on the Android emulator). Run: maestro test apps/carecircle/maestro/
appId: app.carecircle.mobile
env:
  EMAIL: caregiver@example.com
  MAILPIT_URL: http://127.0.0.1:54324
---
- runScript: scripts/clear-mailpit.js
- launchApp:
    clearState: true
- assertVisible:
    id: 'sign-in-screen'
- tapOn:
    id: 'sign-in-email-input'
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: '(?i).*magic link.*'
- assertVisible:
    id: 'sign-in-magic-link-sent'
- retry:
    maxRetries: 5
    commands:
      - runScript: scripts/magic-link-from-mailpit.js
- openLink: ${output.callbackUrl}
- assertVisible: 'CareCircle'
- assertVisible: 'Shared family care plan shell ready.'
- assertNotVisible:
    id: 'sign-in-screen'
